[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dns-exfiltration-research"
version = "0.1.0"
description = "Reproducible defensive DNS/DoH detection and shift-aware feature-selection experiments"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.4.6", "pandas==3.0.6", "scipy==1.17.1",
  "scikit-learn==1.9.1", "joblib==1.6.0",
]

[project.optional-dependencies]
research = ["xgboost==3.2.0", "shap==0.51.0", "matplotlib==3.11.2"]
dev = ["pytest==9.1.1"]

[project.scripts]
dns-research = "dns_exfiltration.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

